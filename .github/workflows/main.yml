name: Build EXE
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Compile C++ to EXE
      run: |
        g++ -O2 -o main.exe main.cpp -lgdi32 -luser32 -mwindows
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
          name: exe-file
          path: main.exe
